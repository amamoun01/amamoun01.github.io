site_name: Abdellatif Mamoun - Portfolio
site_description: Portfolio of Abdellatif Mamoun, Cloud & DevOps Engineer
site_author: Abdellatif Mamoun

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - header.autohide

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

font:
  text: Roboto
  code: Fira Code
  
nav:
  - Home: index.md
  - Experience: experience.md
  - Skills: skills.md
  - Education: education.md
  - Projects: projects.md
  - Certifications: certifications.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Français
      link: /fr/
      lang: fr
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/amamoun01
      name: My GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/abdellatif-mamoun
      name: My LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:abdellatif.mamoun99@outlook.fr
      name: Email Me